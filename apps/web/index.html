<!doctype html>
<html lang="en" data-phosphor="amber">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content"
    />
    <meta name="color-scheme" content="dark" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("portfolio.phosphor");
          if (stored && /^[a-z]+$/.test(stored)) {
            document.documentElement.setAttribute("data-phosphor", stored);
          }
        } catch (error) {}
      })();
    </script>
    <meta name="theme-color" content="#0b0906" />
    <title>Soham Tarabada — Full Stack Developer</title>
    <meta
      name="description"
      content="Full Stack Developer in Vadodara, India. Production platforms for healthcare, e-commerce and enterprise, built with the MERN stack, Docker, Kubernetes and AWS."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
    />
    <link
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
