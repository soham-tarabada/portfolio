<!doctype html>
<html lang="en" data-phosphor="amber">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="color-scheme" content="dark" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("portfolio.admin.phosphor");
          if (stored && /^[a-z]+$/.test(stored)) {
            document.documentElement.setAttribute("data-phosphor", stored);
          }
        } catch (error) {}
      })();
    </script>
    <meta name="theme-color" content="#0b0906" />
    <title>Portfolio Admin</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
